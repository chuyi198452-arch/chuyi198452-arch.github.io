<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ page.summary | escape }}" />
    <title>{{ page.title | escape }} · {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    <script src="{{ '/assets/js/main.js?v=3' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">C</span><span>{{ site.title }}</span></a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a class="active" href="{{ '/#articles' | relative_url }}">文章</a>
          <a href="{{ '/about.html' | relative_url }}">关于我</a>
          <button class="theme-toggle" type="button" aria-label="切换深色模式" title="切换主题"><span aria-hidden="true">◐</span></button>
        </nav>
      </div>
    </header>

    <main id="main" class="article-page section-shell">
      <article>
        <header class="article-header">
          <a class="back-link" href="{{ '/#articles' | relative_url }}">← 返回文章列表</a>
          <div class="post-meta"><span class="tag">{{ page.category_label | escape }}</span><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time></div>
          <h1>{{ page.title | escape }}</h1>
          <p class="lead">{{ page.summary | escape }}</p>
        </header>
        <div class="article-cover art-one"><span>{{ page.category_label | escape }}</span></div>
        <div class="prose">{{ content }}</div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="section-shell footer-inner"><p>© <span data-current-year></span> Chu.</p><a href="{{ '/' | relative_url }}">返回首页</a></div>
    </footer>
  </body>
</html>
